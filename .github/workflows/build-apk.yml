name: Build AtharvNandan APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore and validate google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          target = "app/google-services.json"
          if os.path.exists(target):
              raw = open(target, "r", encoding="utf-8-sig").read()
          else:
              raw = os.environ.get("GOOGLE_SERVICES_JSON", "")

          if not raw.strip():
              print("::error::Missing app/google-services.json! Add repository secret GOOGLE_SERVICES_JSON.")
              sys.exit(1)

          def try_parse(text):
              cleaned = (
                  text.lstrip("\ufeff")
                  .strip()
                  .replace("\u201c", '"')
                  .replace("\u201d", '"')
                  .replace("\u2018", "'")
                  .replace("\u2019", "'")
              )
              try:
                  obj = json.loads(cleaned)
                  if isinstance(obj, dict) and "project_info" in obj and "client" in obj:
                      return obj
              except Exception:
                  pass
              # Try extracting outermost JSON object if extra text was copied around it
              start = cleaned.find("{")
              end = cleaned.rfind("}")
              if start != -1 and end > start:
                  try:
                      obj = json.loads(cleaned[start : end + 1])
                      if isinstance(obj, dict) and "project_info" in obj and "client" in obj:
                          return obj
                  except Exception:
                      pass
              return None

          parsed = try_parse(raw)
          if parsed is None:
              # Try base64-encoded JSON
              try:
                  decoded = base64.b64decode(raw.strip(), validate=False).decode("utf-8", errors="ignore")
                  parsed = try_parse(decoded)
              except Exception:
                  parsed = None

          if parsed is None:
              length = len(raw.strip())
              starts_with_brace = raw.strip().startswith("{")
              ends_with_brace = raw.strip().endswith("}")
              print(
                  f"::error::GOOGLE_SERVICES_JSON secret is not valid google-services.json "
                  f"(length={length}, starts_with_brace={starts_with_brace}, ends_with_brace={ends_with_brace}). "
                  f"Re-download google-services.json from Firebase Console, copy the ENTIRE file from {{ to }}, and update the GOOGLE_SERVICES_JSON secret."
              )
              sys.exit(1)

          with open(target, "w", encoding="utf-8") as f:
              json.dump(parsed, f, indent=2)
          print("Validated app/google-services.json successfully.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          for tool in "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$tool" ]; then
              yes | "$tool" --licenses >/dev/null 2>&1 || true
              break
            fi
          done

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Cache CI debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: atharvnandan-debug-keystore-v1

      - name: Prepare debug keystore for CI
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA1:" | sed 's/.*SHA1:[[:space:]]*//')
          SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')
          echo "APK Signing SHA1: $SHA1"
          echo "APK Signing SHA256: $SHA256"
          {
            echo "### APK Signing Fingerprints (Add to Firebase Console for Google Sign-In)"
            echo "- **SHA-1:** \`$SHA1\`"
            echo "- **SHA-256:** \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtharvNandan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
